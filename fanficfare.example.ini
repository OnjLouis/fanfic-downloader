[defaults]
browser_cache_age_limit:4.0
output_filename:${title}${formatext}
make_directories:true
include_tocpage:false
titlepage_use_table:false
strip_chapter_numbers:true
title_label:Title
author_label:Author
storyUrl_label:URL
description_label:Summary
ships_label:Pairings
numChapters_label:Total chapters
dateUpdated_label:Last updated
titlepage_entries:title,author,storyUrl,description,ships,numChapters,dateUpdated
titlepage_start:
 <?xml version="1.0" encoding="UTF-8"?>
 <html xmlns="http://www.w3.org/1999/xhtml">
 <head>
 <title>${title}</title>
 <link href="stylesheet.css" type="text/css" rel="stylesheet"/>
 </head>
 <body>
titlepage_entry:
 <p>${label}: ${value}</p>
titlepage_end:
 </body>
 </html>
chapter_start:
 <?xml version="1.0" encoding="UTF-8"?>
 <html xmlns="http://www.w3.org/1999/xhtml">
 <head>
 <title>${chapter}</title>
 <link href="stylesheet.css" type="text/css" rel="stylesheet"/>
 <meta name="chapterurl" content="${url}" />
 <meta name="chapterorigtitle" content="${origchapter}" />
 <meta name="chaptertoctitle" content="${tocchapter}" />
 <meta name="chaptertitle" content="${chapter}" />
 </head>
 <body>
 <h2>Chapter ${number}: ${title}</h2>
chapter_end:
 </body>
 </html>

[epub]
output_css:
 body { background-color: #ffffff; text-align: left; margin: 8px; adobe-hyphenate: none; }
 h1 { text-align: left; }
 h2 { text-align: left; }
 h3 { text-align: left; }

[archiveofourown.org]
user_agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
connect_timeout:30.0
slow_down_sleep_time:2
use_browser_cache:true
use_browser_cache_only:false
open_pages_in_browser:false
is_adult:true

[www.fanfiction.net]
use_browser_cache:true
use_browser_cache_only:true
open_pages_in_browser:false
