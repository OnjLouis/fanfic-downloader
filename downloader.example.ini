[paths]
output_dir=downloads
log_dir=logs
failed_url_file=
browser_epub_folder=
reader_path=
fanficfare_exe=fanficfare_env\Scripts\fanficfare.exe
fanficfare_config=fanficfare_personal.ini

[download]
format=epub
open_after_download=true
read_clipboard=true
auto_start_clipboard=true
prefer_native=true
use_fichub=true
use_fichub_for_ao3=true
allow_unverified_ao3_cache=false
fallback_html_to_epub=true
retry_failed_urls=true
native_timeout_seconds=90
preparation_timeout_seconds=120
publish_retry_seconds=30

[cleanup]
remove_afterword=true
remove_chapter_notes=true
remove_separator_lines=true
apply_old_template_style=true
make_story_url_clickable=true

[cleanup_patterns]
separator_text_regex=^x(?:[-_*~.\u2013\u2014]?x){2,}$
separator_line_regex=(?im)^\s*(?:x\s*[-_*~.\u2013\u2014.]\s*){2,}x?\s*$
separator_block_tags=p|center

[template]
stylesheet_css=template.css
page_styles_css=page_styles.css
chapter_heading_format=Chapter {number}: {title}
chapter_file_regex=(?i)(^|/)chap(?:ter)?[_-]?\d+\.
skip_chapter_file_regex=(?i)(nav|toc|title|intro|introduction)\.(xhtml|html)$

[accessibility]
pause_on_error=true
show_wait_messages=false

[updates]
check_for_updates=true
prompt_to_install=true

[advanced]
user_agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36
fichub_user_agent=AO3-Downloader/1.0
